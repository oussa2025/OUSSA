
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صفحتي الشخصية</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }
    header {
      background: #0077b6;
      color: white;
      padding: 2rem;
      text-align: center;
    }
    header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    section {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      color: #0077b6;
      margin-bottom: 1rem;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .skill {
      background: #e0f7fa;
      padding: 1rem;
      border-radius: 8px;
      flex: 1 1 100px;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: #023e8a;
      color: white;
      margin-top: 2rem;
    }
    a {
      color: #0077b6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://via.placeholder.com/120" alt="صورة شخصية" />
    <h1>اسمك هنا</h1>
    <p>مطور ويب | مصمم | كاتب</p>
  </header>

  <section>
    <h2>من أنا</h2>
    <p>نبذة قصيرة عنك، من أنت، ماذا تفعل، وما هي اهتماماتك في الحياة أو في العمل.</p>
  </section>

  <section>
    <h2>مهاراتي</h2>
    <div class="skills">
      <div class="skill">HTML</div>
      <div class="skill">CSS</div>
      <div class="skill">JavaScript</div>
      <div class="skill">تصميم واجهات</div>
    </div>
  </section>

  <section>
    <h2>تواصل معي</h2>
    <p>راسلني عبر <a href="mailto:example@email.com">البريد الإلكتروني</a> أو تابعني على 
      <a href="#">LinkedIn</a> و <a href="#">GitHub</a>.
    </p>
  </section>

  <footer>
    &copy; 2025 اسمك - جميع الحقوق محفوظة
  </footer>
</body>
</html>
